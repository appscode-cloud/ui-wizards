step:
- elements:
  - elements:
    - label: Name
      schema: schema/properties/metadata/properties/name
      type: input
    - label: Select Namespace
      loader: getNamespaces
      schema: schema/properties/metadata/properties/namespace
      type: select
      watcher:
        func: onNamespaceChange
        paths:
        - schema/properties/metadata/properties/namespace
    - label: Select ElasticSearch Database
      loader:
        name: getDbs
        watchPaths:
        - schema/properties/metadata/properties/namespace
      refresh: true
      schema: schema/properties/spec/properties/databaseRef/properties/name
      type: select
      validation:
        type: required
      watcher:
        func: initMetadata
        paths:
        - schema/properties/spec/properties/databaseRef/properties/name
    if:
      name: isConsole
      type: function
    showLabels: false
    type: block-layout
  - if:
      name: isConsole
      type: function
    label: Select Autoscale Type
    options:
    - description: Scale your CPU Memory based on resource usage
      text: Compute
      value: compute
    - description: Expand your database size based on volume usage
      text: Storage
      value: storage
    schema: temp/properties/autoscalingType
    type: radio
    validation:
      type: required
    watcher:
      func: initMetadata
      paths:
      - temp/properties/autoscalingType
  - elements:
    - elements:
      - elements:
        - init:
            type: func
            value: setTrigger
          label: Trigger
          options:
          - "On"
          - "Off"
          schema: schema/properties/spec/properties/compute/properties/node/properties/trigger
          type: select
        - label: Pod Life Time Threshold
          schema: schema/properties/spec/properties/compute/properties/node/properties/podLifeTimeThreshold
          type: input
        - label: Resource Difference Percentage
          schema: schema/properties/spec/properties/compute/properties/node/properties/resourceDiffPercentage
          type: input
        - elements:
          - label: CPU
            schema: schema/properties/spec/properties/compute/properties/node/properties/minAllowed/properties/cpu
            type: input
          - label: Memory
            schema: schema/properties/spec/properties/compute/properties/node/properties/minAllowed/properties/memory
            type: input
          label: Min Allowed
          showLabels: true
          type: block-layout
        - elements:
          - label: CPU
            schema: schema/properties/spec/properties/compute/properties/node/properties/maxAllowed/properties/cpu
            type: input
          - label: Memory
            schema: schema/properties/spec/properties/compute/properties/node/properties/maxAllowed/properties/memory
            type: input
          label: Max Allowed
          showLabels: true
          type: block-layout
        - label: Controlled Resources
          loader: setControlledResources|node
          multiple: true
          schema: schema/properties/spec/properties/compute/properties/node/properties/controlledResources
          type: select
        showLabels: false
        type: block-layout
      if:
        name: dbTypeEqualsTo|node
        type: function
      label: Node
      showLabels: true
      type: block-layout
    - elements:
      - elements:
        - init:
            type: func
            value: setTrigger
          label: Trigger
          options:
          - "On"
          - "Off"
          schema: schema/properties/spec/properties/compute/properties/data/properties/trigger
          type: select
        - label: Pod Life Time Threshold
          schema: schema/properties/spec/properties/compute/properties/data/properties/podLifeTimeThreshold
          type: input
        - label: Resource Difference Percentage
          schema: schema/properties/spec/properties/compute/properties/data/properties/resourceDiffPercentage
          type: input
        - elements:
          - label: CPU
            schema: schema/properties/spec/properties/compute/properties/data/properties/minAllowed/properties/cpu
            type: input
          - label: Memory
            schema: schema/properties/spec/properties/compute/properties/data/properties/minAllowed/properties/memory
            type: input
          label: Min Allowed
          showLabels: true
          type: block-layout
        - elements:
          - label: CPU
            schema: schema/properties/spec/properties/compute/properties/data/properties/maxAllowed/properties/cpu
            type: input
          - label: Memory
            schema: schema/properties/spec/properties/compute/properties/data/properties/maxAllowed/properties/memory
            type: input
          label: Max Allowed
          showLabels: true
          type: block-layout
        - label: Controlled Resources
          loader: setControlledResources|data
          multiple: true
          schema: schema/properties/spec/properties/compute/properties/data/properties/controlledResources
          type: select
        label: Data
        showLabels: true
        type: block-layout
      - elements:
        - init:
            type: func
            value: setTrigger
          label: Trigger
          options:
          - "On"
          - "Off"
          schema: schema/properties/spec/properties/compute/properties/ingest/properties/trigger
          type: select
        - label: Pod Life Time Threshold
          schema: schema/properties/spec/properties/compute/properties/ingest/properties/podLifeTimeThreshold
          type: input
        - label: Resource Difference Percentage
          schema: schema/properties/spec/properties/compute/properties/ingest/properties/resourceDiffPercentage
          type: input
        - elements:
          - label: CPU
            schema: schema/properties/spec/properties/compute/properties/ingest/properties/minAllowed/properties/cpu
            type: input
          - label: Memory
            schema: schema/properties/spec/properties/compute/properties/ingest/properties/minAllowed/properties/memory
            type: input
          label: Min Allowed
          showLabels: true
          type: block-layout
        - elements:
          - label: CPU
            schema: schema/properties/spec/properties/compute/properties/ingest/properties/maxAllowed/properties/cpu
            type: input
          - label: Memory
            schema: schema/properties/spec/properties/compute/properties/ingest/properties/maxAllowed/properties/memory
            type: input
          label: Max Allowed
          showLabels: true
          type: block-layout
        - label: Controlled Resources
          loader: setControlledResources|ingest
          multiple: true
          schema: schema/properties/spec/properties/compute/properties/ingest/properties/controlledResources
          type: select
        label: Ingest
        showLabels: true
        type: block-layout
      - elements:
        - init:
            type: func
            value: setTrigger
          label: Trigger
          options:
          - "On"
          - "Off"
          schema: schema/properties/spec/properties/compute/properties/master/properties/trigger
          type: select
        - label: Pod Life Time Threshold
          schema: schema/properties/spec/properties/compute/properties/master/properties/podLifeTimeThreshold
          type: input
        - label: Resource Difference Percentage
          schema: schema/properties/spec/properties/compute/properties/master/properties/resourceDiffPercentage
          type: input
        - elements:
          - label: CPU
            schema: schema/properties/spec/properties/compute/properties/master/properties/minAllowed/properties/cpu
            type: input
          - label: Memory
            schema: schema/properties/spec/properties/compute/properties/master/properties/minAllowed/properties/memory
            type: input
          label: Min Allowed
          showLabels: true
          type: block-layout
        - elements:
          - label: CPU
            schema: schema/properties/spec/properties/compute/properties/master/properties/maxAllowed/properties/cpu
            type: input
          - label: Memory
            schema: schema/properties/spec/properties/compute/properties/master/properties/maxAllowed/properties/memory
            type: input
          label: Max Allowed
          showLabels: true
          type: block-layout
        - label: Controlled Resources
          loader: setControlledResources|master
          multiple: true
          schema: schema/properties/spec/properties/compute/properties/master/properties/controlledResources
          type: select
        label: Master
        showLabels: true
        type: block-layout
      if:
        name: dbTypeEqualsTo|topology
        type: function
      showLabels: false
      type: block-layout
    - elements:
      - label: Select Node Topology
        loader: fetchNodeTopology
        schema: schema/properties/spec/properties/compute/properties/nodeTopology/properties/name
        type: select
      - if:
          name: isNodeTopologySelected
          type: function
        label: Scale-up Difference Percentage
        schema: schema/properties/spec/properties/compute/properties/nodeTopology/properties/scaleUpDiffPercentage
        type: input
      - if:
          name: isNodeTopologySelected
          type: function
        label: Scale-down Difference Percentage
        schema: schema/properties/spec/properties/compute/properties/nodeTopology/properties/scaleDownDiffPercentage
        type: input
      label: Node Topology
      showLabels: true
      type: block-layout
    if:
      name: ifScalingTypeEqualsTo|compute
      type: function
    showLabels: false
    type: block-layout
  - elements:
    - elements:
      - init:
          type: func
          value: setTrigger
        label: Trigger
        options:
        - "On"
        - "Off"
        schema: schema/properties/spec/properties/storage/properties/node/properties/trigger
        type: select
      - label: Expansion Mode
        options:
        - Online
        - Offline
        schema: schema/properties/spec/properties/storage/properties/node/properties/expansionMode
        type: select
      - label: Usage Threshold
        schema: schema/properties/spec/properties/storage/properties/node/properties/usageThreshold
        type: input
      - elements:
        - label: Applies Upto
          schema: appliesUpto
          type: input
        - label: Threshold
          schema: threshold
          type: input
        label: Scaling Rules
        schema: schema/properties/spec/properties/storage/properties/node/properties/scalingRules
        type: array-object-form
      - label: Upper Bound
        schema: schema/properties/spec/properties/storage/properties/node/properties/upperBound
        type: input
      if:
        name: dbTypeEqualsTo|node
        type: function
      label: Node
      showLabels: true
      type: block-layout
    - elements:
      - elements:
        - init:
            type: func
            value: setTrigger
          label: Trigger
          options:
          - "On"
          - "Off"
          schema: schema/properties/spec/properties/storage/properties/data/properties/trigger
          type: select
        - label: Expansion Mode
          options:
          - Online
          - Offline
          schema: schema/properties/spec/properties/storage/properties/data/properties/expansionMode
          type: select
        - label: Usage Threshold
          schema: schema/properties/spec/properties/storage/properties/data/properties/usageThreshold
          type: input
        - elements:
          - label: Applies Upto
            schema: appliesUpto
            type: input
          - label: Threshold
            schema: threshold
            type: input
          label: Scaling Rules
          schema: schema/properties/spec/properties/storage/properties/data/properties/scalingRules
          type: array-object-form
        - label: Upper Bound
          schema: schema/properties/spec/properties/storage/properties/data/properties/upperBound
          type: input
        label: Data
        showLabels: true
        type: block-layout
      - elements:
        - init:
            type: func
            value: setTrigger
          label: Trigger
          options:
          - "On"
          - "Off"
          schema: schema/properties/spec/properties/storage/properties/ingest/properties/trigger
          type: select
        - label: Expansion Mode
          options:
          - Online
          - Offline
          schema: schema/properties/spec/properties/storage/properties/ingest/properties/expansionMode
          type: select
        - label: Usage Threshold
          schema: schema/properties/spec/properties/storage/properties/ingest/properties/usageThreshold
          type: input
        - elements:
          - label: Applies Upto
            schema: appliesUpto
            type: input
          - label: Threshold
            schema: threshold
            type: input
          label: Scaling Rules
          schema: schema/properties/spec/properties/storage/properties/ingest/properties/scalingRules
          type: array-object-form
        - label: Upper Bound
          schema: schema/properties/spec/properties/storage/properties/ingest/properties/upperBound
          type: input
        label: Ingest
        showLabels: true
        type: block-layout
      - elements:
        - init:
            type: func
            value: setTrigger
          label: Trigger
          options:
          - "On"
          - "Off"
          schema: schema/properties/spec/properties/storage/properties/master/properties/trigger
          type: select
        - label: Expansion Mode
          options:
          - Online
          - Offline
          schema: schema/properties/spec/properties/storage/properties/master/properties/expansionMode
          type: select
        - label: Usage Threshold
          schema: schema/properties/spec/properties/storage/properties/master/properties/usageThreshold
          type: input
        - elements:
          - label: Applies Upto
            schema: appliesUpto
            type: input
          - label: Threshold
            schema: threshold
            type: input
          label: Scaling Rules
          schema: schema/properties/spec/properties/storage/properties/master/properties/scalingRules
          type: array-object-form
        - label: Upper Bound
          schema: schema/properties/spec/properties/storage/properties/master/properties/upperBound
          type: input
        label: Master
        showLabels: true
        type: block-layout
      if:
        name: dbTypeEqualsTo|topology
        type: function
      showLabels: false
      type: block-layout
    if:
      name: ifScalingTypeEqualsTo|storage
      type: function
    showLabels: false
    type: block-layout
  - elements:
    - label: Timeout
      options:
      - text: 5 minutes
        value: 5m
      - text: 10 minutes
        value: 10m
      - text: 30 minutes
        value: 30m
      - text: 1 hour
        value: 1h
      - text: 2 hours
        value: 2h
      - text: 5 hours
        value: 5h
      - text: 10 hours
        value: 10h
      schema: schema/properties/spec/properties/opsRequestOptions/properties/timeout
      type: select
    - init:
        type: func
        value: setApplyToIfReady
      label: Apply
      options:
      - text: IfReady (OpsRequest will be applied if database is ready)
        value: IfReady
      - text: Always (OpsRequest will always be applied)
        value: Always
      schema: schema/properties/spec/properties/opsRequestOptions/properties/apply
      type: radio
    if:
      name: showOpsRequestOptions
      type: function
    label: Ops Request Options
    showLabels: true
    type: block-layout
  id: basic
  loader:
    name: getDbDetails
    watchPaths:
    - schema/properties/spec/properties/databaseRef/properties/name
  type: single-step-form
type: multi-step-form
