step:
- elements:
  - disable: isVariantAvailable
    if:
      name: showAndInitName
      type: function
    label: Restore Session Name
    schema: schema/properties/metadata/properties/release/properties/name
    type: input
  - addNewButton:
      label: Add New Namespace
      target: _blank
      url:
        function: getCreateNameSpaceUrl
    disable: isNamespaceDisabled
    if:
      name: showAndInitNamespace
      type: function
    init:
      type: func
      value: initNamespace
    label: Namespace
    loader: getResources|core|v1|namespaces
    refresh: true
    schema: schema/properties/metadata/properties/release/properties/namespace
    type: select
  - elements:
    - if:
        name: showIfDoesNotHaveOperationQuery
        type: function
      label: Labels
      schema: schema/properties/spec/properties/labels
      type: object-item
    - if:
        name: showIfDoesNotHaveOperationQuery
        type: function
      label: Annotations
      schema: schema/properties/spec/properties/annotations
      type: object-item
    - disable: isDatabaseSelectDisabled
      if:
        name: showAndInitDatabase
        type: function
      label: Select AppBinding
      loader:
        name: fetchDatabases
        watchPaths:
        - schema/properties/metadata/properties/release/properties/namespace
      refresh: true
      schema: schema/properties/spec/properties/target
      type: select
    - addNewButton:
        label: Create New Repository
        target: _blank
        url:
          function: getCreateRepositoryUrl
      label: Select Repository
      loader:
        name: fetchRepositories
        watchPaths:
        - schema/properties/metadata/properties/release/properties/namespace
      refresh: true
      schema: schema/properties/spec/properties/repository
      type: select
    - label: Snapshot
      schema: schema/properties/spec/properties/snapshot
      type: input
    - elements:
      - label: Storage Class
        loader: getStorageClassNames|/spec/interimVolumeTemplate/spec/storageClassName
        schema: schema/properties/spec/properties/interimVolumeTemplate/properties/spec/properties/storageClassName
        type: select
      - label: Storage Size
        schema: schema/properties/spec/properties/interimVolumeTemplate/properties/spec/properties/resources/properties/requests/properties/storage
        type: input
      if:
        name: showInterimVolumneTemplate
        type: function
      label: Interim Volume
      showLabels: true
      type: block-layout
    - elements:
      - label: Customize Restore Job Runtime Settings?
        schema: temp/properties/customizeRestoreJobRuntimeSettings
        type: switch
        watcher:
          func: onCustomizeRestoreJobRuntimeSettingsChange
          paths:
          - temp/properties/customizeRestoreJobRuntimeSettings
      - elements:
        - label: Service Account Name
          loader:
            name: getServiceAccounts
            watchPaths:
            - schema/properties/metadata/properties/release/properties/namespace
          schema: schema/properties/spec/properties/runtimeSettings/properties/pod/properties/serviceAccountName
          type: select
        - label: FS Group
          schema: schema/properties/spec/properties/runtimeSettings/properties/pod/properties/securityContext/properties/fsGroup
          type: input
        - label: Run As User
          schema: schema/properties/spec/properties/runtimeSettings/properties/pod/properties/securityContext/properties/runAsUser
          type: input
        - label: Run As Group
          schema: schema/properties/spec/properties/runtimeSettings/properties/pod/properties/securityContext/properties/runAsGroup
          type: input
        if:
          name: showRuntimeSettingsForm
          type: function
        label: Pod Runtime Settings
        showLabels: true
        type: block-layout
      label: Runtime Settings
      showLabels: true
      type: block-layout
    showLabels: false
    type: block-layout
  id: options
  type: single-step-form
type: multi-step-form
