step:
  - elements:
      - label: Ops Request Name
        schema: schema/properties/metadata/properties/name
        type: input
        validation:
          type: required
      - disable: isNamespaceDisabled
        hasGroup: isRancherManaged
        init:
          type: func
          value: initNamespace
        label: Namespace
        loader: getNamespaces
        schema: schema/properties/metadata/properties/namespace
        type: select
        validation:
          type: required
        watcher:
          func: onNamespaceChange
          paths:
            - schema/properties/metadata/properties/namespace
      - disable: isVaultRefDisabled
        init:
          type: func
          value: initVaultRef
        label: Select your VaultServer
        loader:
          name: getVaults
          watchPaths:
            - schema/properties/metadata/properties/namespace
        schema: schema/properties/spec/properties/vaultRef/properties/name
        type: select
        validation:
          type: required
        watcher:
          func: onVaultChange
          paths:
            - schema/properties/spec/properties/vaultRef/properties/name
      - label: Timeout
        schema: schema/properties/spec/properties/timeout
        type: time-picker
      - label: Configure Ops Request
        type: label-element
      - disable: isVaultDetailsLoading
        init:
          type: func
          value: getRequestTypeFromRoute
        label: Type of Ops Request
        options:
          - description: Restart your VaultServer
            text: Restart
            value: Restart
          - description: Reconfigure your VaultServer tls configuration
            text: Reconfigure TLS
            value: ReconfigureTLS
        schema: schema/properties/spec/properties/type
        type: radio
        watcher:
          func: onRequestTypeChange
          paths:
            - schema/properties/spec/properties/type
      - elements:
          - if:
              name: hasTlsField
              type: function
            init:
              type: func
              value: initTlsOperation
            label: Choose TLS Operation
            options:
              - text: Update
                value: update
              - text: Rotate
                value: rotate
              - text: Remove
                value: remove
            schema: temp/properties/tlsOperation
            type: radio
            watcher:
              func: onTlsOperationChange
              paths:
                - temp/properties/tlsOperation
          - elements:
              - disable: true
                init:
                  type: func
                  value: initIssuerRefApiGroup
                label: API Group
                schema: schema/properties/spec/properties/tls/properties/issuerRef/properties/apiGroup
                type: input
                watcher:
                  func: initIssuerRefApiGroup
                  paths:
                    - schema/properties/spec/properties/tls/properties/issuerRef/properties/kind
              - init:
                  type: func
                  value: setValueFromVaultDetails|/spec/tls/issuerRef/kind
                label: Kind
                options:
                  - text: Issuer
                    value: Issuer
                  - text: ClusterIssuer
                    value: ClusterIssuer
                schema: schema/properties/spec/properties/tls/properties/issuerRef/properties/kind
                type: select
                validation:
                  name: isIssuerRefRequired
                  type: custom
                watcher:
                  func: setValueFromVaultDetails|/spec/tls/issuerRef/kind
                  paths:
                    - temp/properties/vaultDetails
              - init:
                  type: func
                  value: setValueFromVaultDetails|/spec/tls/issuerRef/name
                label: Resource Name
                loader:
                  name: getIssuerRefsName
                  watchPaths:
                    - schema/properties/spec/properties/tls/properties/issuerRef/properties/apiGroup
                    - schema/properties/spec/properties/tls/properties/issuerRef/properties/kind
                    - schema/properties/metadata/properties/namespace
                schema: schema/properties/spec/properties/tls/properties/issuerRef/properties/name
                type: select
                validation:
                  name: isIssuerRefRequired
                  type: custom
                watcher:
                  func: setValueFromVaultDetails|/spec/tls/issuerRef/name
                  paths:
                    - temp/properties/vaultDetails
            if:
              name: showIssuerRefAndCertificates
              type: function
            showLabels: false
            type: block-layout
          - elements:
              - buttonClass: is-light is-outlined
                elements:
                  - disable: disableAlias
                    label: Alias
                    loader: fetchAliasOptions
                    schema: alias
                    sortable: true
                    type: select
                  - label: Secret Name
                    schema: secretName
                    type: input
                  - label: Duration
                    schema: duration
                    type: input
                  - label: Renew Before
                    schema: renewBefore
                    type: input
                  - elements:
                      - element:
                          label: Organization
                          type: input
                        label: Organizations
                        schema: subject/properties/organizations
                        type: array-item-form
                      - element:
                          label: Country
                          type: input
                        label: Countries
                        schema: subject/properties/countries
                        type: array-item-form
                      - element:
                          label: Organizational Unit
                          type: input
                        label: Organizational Units
                        schema: subject/properties/organizationalUnits
                        type: array-item-form
                      - element:
                          label: Province
                          type: input
                        label: Provinces
                        schema: subject/properties/provinces
                        type: array-item-form
                    label: Subject
                    showLabels: true
                    type: block-layout
                  - element:
                      label: DNS Name
                      type: input
                    label: DNS Names
                    schema: dnsNames
                    type: array-item-form
                  - element:
                      label: IP Address
                      type: input
                    label: IP Addresses
                    schema: ipAddresses
                    type: array-item-form
                label: Certificates
                schema: schema/properties/spec/properties/tls/properties/certificates
                type: array-object-form
            if:
              name: showIssuerRefAndCertificates
              type: function
            loader: setValueFromVaultDetails|/spec/tls/certificates|/spec/tls/certificates
            showLabels: false
            type: block-layout
        if:
          name: ifRequestTypeEqualsTo|ReconfigureTLS
          type: function
        label: Reconfigure TLS
        showLabels: false
        type: block-layout
    id: basic
    label: Basic Information
    loader: getVaultDetails
    type: single-step-form
type: multi-step-form
