    id: backend
    label: Backend
    type: single-step-form
  - elements:
      - buttonClass: is-light is-outlined
        elements:
          - label: Data Source Type
            options:
              - ConfigMap
              - Secret
              - CSI
            schema: temp/properties/dataSource
            type: select
          - elements:
              - fullwidth: true
                label: Is Optional?
