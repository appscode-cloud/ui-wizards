      - label: Labels
        schema: schema/properties/resources/properties/kubevaultComVaultServer/properties/metadata/properties/labels
        type: object-item
      - label: Annotations
        schema: schema/properties/resources/properties/kubevaultComVaultServer/properties/metadata/properties/annotations
        type: object-item
      - disable: true
        label: Replica Number
        schema: schema/properties/resources/properties/kubevaultComVaultServer/properties/spec/properties/replicas
        type: input
      - label: Termination Policy
        options:
          - description: Keep only database Secrets and backed up data.
            text: Delete
            value: Delete
          - description: Keep PVCs, database Secrets and backed up data.
            text: Halt
            value: Halt
          - description: Delete everything including backed up data.
            text: WipeOut
            value: WipeOut
          - description: Prevent deletion of the VaultServer CRD.
            text: DoNotTerminate
            value: DoNotTerminate
        schema: schema/properties/resources/properties/kubevaultComVaultServer/properties/spec/properties/terminationPolicy
        type: radio
    id: basic
