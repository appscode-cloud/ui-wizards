                    type: input
                  - label: Mode
                    schema: mode
                    type: input
                  - label: Path
                    schema: path
                    type: input
                label: Items
                schema: configMap/properties/items
                type: array-object-form
            if:
              name: isDataSourceTypeEqualTo|ConfigMap
              type: function
            showLabels: false
            type: block-layout
          - elements:
              - fullwidth: true
                label: Is Optional?
                schema: secret/properties/optional
                type: switch
              - label: Secret Name
