step:
  - elements:
      - disable: true
        label: VaultServer Name
        schema: schema/properties/metadata/properties/release/properties/name
        type: input
        watcher:
          func: onNameChange
          paths:
            - schema/properties/metadata/properties/release/properties/name
      - disable: true
        label: Namespace
        schema: schema/properties/metadata/properties/release/properties/namespace
        type: input
      - disable: true
        label: VaultServer Version
        schema: schema/properties/resources/properties/kubevaultComVaultServer/properties/spec/properties/version
