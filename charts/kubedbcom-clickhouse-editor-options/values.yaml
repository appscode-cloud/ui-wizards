# Default values for kubedbcom-clickhouse-editor-options.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

metadata:
  resource:
    group: kubedb.com
    kind: ClickHouse
    name: clickhouses
    scope: Namespaced
    version: v1alpha2
  release:
    # Release name
    name: ""
    # Release namespace
    namespace: ""

spec:
  # Annotations to add to the database custom resource
  annotations: {}

  # Labels to add to all the template objects
  labels: {}

  # Standalone, Topology
  mode: Standalone
  topology:
    clickHouseKeeper:
      externallyManaged: false
      node:
        host: clickhouse-keeper.click-keeper
        port: 2181
      spec:
        persistence:
          size: 2Gi
        podResources:
          machine: ""

          resources:
            requests:
              cpu: 500m
              memory: 1Gi
        replicas: 2
    cluster:
      replicas: 3
      shards: 2

  deletionPolicy: WipeOut

  persistence:
    size: 2Gi
  podResources:
    machine: ""

    resources:
      requests:
        cpu: 1
        memory: 3Gi

  authSecret:
    name: ""

    password: ""
  configuration: ""

  openshift:
    securityContext:
      runAsUser:

  # Service templates applied to the database services, keyed by alias.
  serviceTemplates: []
  admin:
    deployment:
      default: Shared
      toggle: true
    clusterTier:
      default: "GeneralPurpose"
      toggle: true
      nodeTopology:
        available: []
        default: ""
        toggle: true
      placement:
        available: []
        default: ""
        toggle: true

    showPreview: false
    leftPanel:
      showInsights: true
      showVaultInfo: true
      showOperations: true
      showBackup: true
      showBackupLegacy: false
      showSecurity: false

    nodeSelector: {}
    tolerations: []

    databases:
      ClickHouse:
        versions:
          available: []
          default: ""
          toggle: true
        mode:
          available: ["Standalone", "Topology"]
          default: "Topology"
          toggle: true
    storageClasses:
      available: []
      default: ""
      toggle: true

    tls:
      default: false
      toggle: true
    clusterIssuers:
      available: []
      default: ""
      toggle: true
    expose:
      enable:
        default: false
        toggle: false
      uiExposure:
        disableUI: false
        disableCostEfficiency: false

    # Default service templates offered by the preset, keyed by alias.
    serviceTemplates: []
    monitoring:
      # Name of monitoring agent (one of "prometheus.io", "prometheus.io/operator", "prometheus.io/builtin")
      agent: ""
      exporter:
        resources: # +doc-gen:break
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
      serviceMonitor:
        # Scrape interval for the generated ServiceMonitor.
        interval: 30s
        # Labels used by Prometheus to select the generated ServiceMonitor.
        labels: {}
        # Scrape endpoints, each with optional relabeling rules.
        endpoints: []
      toggle: false
    alert:
      toggle: false

    authCredential:
      customize: true
      referExisting: true
    customConfiguration: true

    deletionPolicy:
      default: WipeOut
      toggle: true
    backup:
      enable:
        default: false
        toggle: false
      by: BackupConfiguration
      via: Restic
    archiver:
      enable:
        default: false
        toggle: false
      via: Restic
    pointInTimeRecovery:
      default: false
      toggle: false

    gitOps:
      enable:
        default: false
        toggle: false
    machineProfiles:
      machines: []
      available: []
      default: ""

  backup:
    tool: ""
    toggle: true
    kubestash:
      schedule: ""
      storageRef:
        name: ""
        namespace: ""
      retentionPolicy:
        name: ""
        namespace: ""
      encryptionSecret:
        name: ""
        namespace: ""
  monitoring:
    serviceMonitor:
      # Specify the labels for ServiceMonitor.
      # Prometheus crd will select ServiceMonitor using these labels.
      # Only usable when monitoring agent is `prometheus.io/webhook server`.
      labels: {}
form:
  alert:
    ## Suffix appended to .Release.Name to form the application name ($app).
    ## Leave empty for standalone deployments. Set when deployed as a subchart
    ## to match the KubeDB resource suffix (e.g. "-ch" for ClickHouse).
    appSuffix: ""

    ## Enable PrometheusRule alerts
    enabled: warning

    ## Labels for default rules
    labels: # +doc-gen:break
      release: kube-prometheus-stack

    ## Annotations for default rules
    annotations: {}

    ## Additional labels for PrometheusRule alerts
    additionalRuleLabels: {}

    ## Prefix for runbook URLs. Use this to override the first part of the runbookURLs that is common to all rules.
    # runbookUrl: "https://runbooks.prometheus-operator.dev/runbooks"

    groups:
      database:
        enabled: warning
        rules:
          clickhouseInstanceDown:
            enabled: true
            duration: "1m"
            severity: critical
          clickhouseTooManyConnections:
            enabled: true
            duration: "5m"
            val: 400
            severity: critical
          clickhouseTooManyActiveQueries:
            enabled: true
            duration: "1m"
            val: 500
            severity: warning
          clickhouseReplicationPartFetchFailed:
            enabled: true
            duration: "5m"
            severity: warning
          clickhouseBrokenPartsDetected:
            enabled: true
            duration: "0m"
            severity: critical
          clickhouseDataPartCorrupted:
            enabled: true
            duration: "5m"
            severity: warning
          # Sepcifies the alert configuration for persistent volume usages.
          diskUsageHigh:
            enabled: true
            val: 80
            duration: "5m"
            severity: warning
          diskAlmostFull:
            enabled: true
            val: 95
            duration: "5m"
            severity: critical
      provisioner:
        enabled: warning
        rules:
          appPhaseNotReady:
            enabled: true
            duration: "1m"
            severity: critical
          appPhaseCritical:
            enabled: true
            duration: "15m"
            severity: warning
      opsManager:
        enabled: warning
        rules:
          opsRequestOnProgress:
            enabled: true
            duration: "0m"
            severity: info
          opsRequestStatusProgressingToLong:
            enabled: true
            duration: "30m"
            severity: critical
          opsRequestFailed:
            enabled: true
            duration: "0m"
            severity: critical
      kubeStash:
        enabled: warning
        rules:
          backupSessionFailed:
            enabled: true
            duration: "0m"
            severity: critical
          restoreSessionFailed:
            enabled: true
            duration: "0m"
            severity: critical
          noBackupSessionForTooLong:
            enabled: true
            duration: "0m"
            val: 18000
            severity: warning
          repositoryCorrupted:
            enabled: true
            duration: "5m"
            severity: critical
          repositoryStorageRunningLow:
            enabled: true
            duration: "5m"
            val: 10737418240 # 10GB
            severity: warning
          backupSessionPeriodTooLong:
            enabled: true
            duration: "0m"
            val: 1800 # 30 minute
            severity: warning
          restoreSessionPeriodTooLong:
            enabled: true
            duration: "0m"
            val: 1800 # 30 minute
            severity: warning
