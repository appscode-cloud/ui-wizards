# Default values for kubedbcom-weaviate-editor-options.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

metadata:
  resource:
    group: kubedb.com
    kind: Weaviate
    name: weaviates
    scope: Namespaced
    version: v1alpha2
  release:
    # Release name
    name: ""
    # Release namespace
    namespace: ""

spec:
  # Annotations to add to the database custom resource
  annotations: {}

  # Labels to add to all the template objects
  labels: {}

  replicas: 3

  disableSecurity: false

  deletionPolicy: WipeOut

  healthChecker:
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3

  persistence:
    size: 4Gi
  podResources:
    machine: ""

    resources:
      requests:
        cpu: 500m
        memory: 1Gi

  authSecret:
    name: ""

    allowedKeys: ""
  configuration: ""

  openshift:
    securityContext:
      runAsUser: null
      runAsNonRoot: false

  # Service templates applied to the database services, keyed by alias.
  serviceTemplates: []
  admin:
    deployment:
      default: Shared
      toggle: true
    clusterTier:
      default: "GeneralPurpose"
      toggle: true
      nodeTopology:
        available: []
        default: ""
        toggle: true
      placement:
        available: []
        default: ""
        toggle: true

    showPreview: false
    leftPanel:
      showInsights: true
      showVaultInfo: true
      showOperations: true
      showBackup: true
      showBackupLegacy: false
      showSecurity: false

    nodeSelector: {}
    tolerations: []

    databases:
      Weaviate:
        versions:
          available: []
          default: ""
          toggle: true
        mode:
          available: ["Standalone", "Replicaset"]
          default: "Replicaset"
          toggle: true
    storageClasses:
      available: []
      default: ""
      toggle: true
    tls:
      default: false
      toggle: true
    clusterIssuers:
      available: []
      default: ""
      toggle: true
    expose:
      enable:
        default: false
        toggle: true
      uiExposure:
        disableUI: false
        disableCostEfficiency: false

    # Default service templates offered by the preset, keyed by alias.
    serviceTemplates: []
    monitoring:
      # Name of monitoring agent (one of "prometheus.io", "prometheus.io/operator", "prometheus.io/builtin")
      agent: prometheus.io/operator
      exporter:
        resources: # +doc-gen:break
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
      serviceMonitor:
        # Scrape interval for the generated ServiceMonitor.
        interval: 30s
        # Labels used by Prometheus to select the generated ServiceMonitor.
        labels: {}
        # Scrape endpoints, each with optional relabeling rules.
        endpoints: []
      toggle: true
    alert:
      toggle: true

    authCredential:
      customize: true
      referExisting: true
    customConfiguration: true

    deletionPolicy:
      default: WipeOut
      toggle: true
    backup:
      enable:
        default: true
        toggle: true
      by: BackupConfiguration
      via: Restic
    archiver:
      enable:
        default: false
        toggle: true
      via: Restic
    pointInTimeRecovery:
      default: false
      toggle: true

    gitOps:
      enable:
        default: false
        toggle: false
    machineProfiles:
      machines: []
      available: []
      default: ""

  backup:
    tool: ""
    toggle: true
    kubestash:
      schedule: ""
      storageRef:
        name: ""
        namespace: ""
      retentionPolicy:
        name: ""
        namespace: ""
      encryptionSecret:
        name: ""
        namespace: ""
  monitoring:
    serviceMonitor:
      # Specify the labels for ServiceMonitor.
      # Prometheus crd will select ServiceMonitor using these labels.
      # Only usable when monitoring agent is `prometheus.io/webhook server`.
      labels: {}
form:
  alert:
    ## Enable PrometheusRule alerts
    enabled: warning

    ## Labels for default rules
    labels: # +doc-gen:break
      release: prometheus

    ## Annotations for default rules
    annotations: {}

    ## Additional labels for PrometheusRule alerts
    additionalRuleLabels: {}

    ## Prefix for runbook URLs. Use this to override the first part of the runbookURLs that is common to all rules.
    # runbookUrl: "https://runbooks.prometheus-operator.dev/runbooks"

    groups:
      database:
        enabled: warning
        rules:
          # Specifies the alert configuration for Weaviate metrics scrape failure.
          weaviateInstanceDown:
            enabled: true
            duration: 30s
            severity: critical
          # Specifies the alert configuration for Weaviate pod restarts.
          weaviateRestarted:
            enabled: true
            duration: 1m
            severity: warning
            val: 180
          # Specifies the alert configuration for Weaviate CPU usage percentage against requests.
          weaviateHighCPUUsage:
            enabled: true
            duration: 1m
            severity: warning
            val: 80
          # Specifies the alert configuration for Weaviate memory usage percentage against limits.
          weaviateHighMemoryUsage:
            enabled: true
            duration: 1m
            severity: warning
            val: 80
          # Specifies the alert configuration for Weaviate process resident memory usage in bytes.
          weaviateHighProcessMemoryUsage:
            enabled: true
            duration: 5m
            severity: warning
            val: 1073741824
          # Specifies the alert configuration for high Go goroutine count.
          weaviateGoroutinesExplosion:
            enabled: true
            duration: 5m
            severity: warning
            val: 1000
          # Specifies the alert configuration for high Go thread count.
          weaviateHighThreadPressure:
            enabled: true
            duration: 5m
            severity: warning
            val: 100
          # Specifies the alert configuration for high process open file descriptor usage percentage.
          weaviateHighFDsUsage:
            enabled: true
            duration: 5m
            severity: warning
            val: 80
          # Specifies the alert configuration for persistent volume usage.
          diskUsageHigh:
            enabled: true
            val: 80
            duration: 1m
            severity: warning
          # Specifies the alert configuration for critically high persistent volume usage.
          diskAlmostFull:
            enabled: true
            val: 95
            duration: 1m
            severity: critical
          # Specifies the alert configuration for high HTTP error percentage.
          weaviateHTTPErrorRateHigh:
            enabled: true
            val: 5
            duration: 5m
            severity: warning
          # Specifies the alert configuration for high HTTP p95 latency in seconds.
          weaviateHTTPP95LatencyHigh:
            enabled: true
            val: 1
            duration: 5m
            severity: warning
          # Specifies the alert configuration for high gRPC error percentage.
          weaviateGRPCErrorRateHigh:
            enabled: true
            val: 5
            duration: 5m
            severity: warning
          # Specifies the alert configuration for high gRPC p95 latency in seconds.
          weaviateGRPCP95LatencyHigh:
            enabled: true
            val: 1
            duration: 5m
            severity: warning
          # Specifies the alert configuration for replication engine running status.
          weaviateReplicationEngineDown:
            enabled: true
            duration: 1m
            severity: critical
          # Specifies the alert configuration for replication pending operations.
          weaviateReplicationQueueHigh:
            enabled: true
            val: 10
            duration: 5m
            severity: warning
          # Specifies the alert configuration for replication failures.
          weaviateReplicationFailuresHigh:
            enabled: true
            val: 0
            duration: 5m
            severity: warning

      provisioner:
        enabled: warning
        rules:
          appPhaseNotReady:
            enabled: true
            duration: 1m
            severity: critical
          appPhaseCritical:
            enabled: true
            duration: 15m
            severity: warning
