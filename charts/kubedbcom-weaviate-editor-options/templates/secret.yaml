{{- if .Values.spec.authSecret.allowedKeys -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubedbcom-weaviate-editor-options.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubedbcom-weaviate-editor-options.labels" . | nindent 4 }}
type: Opaque
data:
  AUTHENTICATION_APIKEY_ALLOWED_KEYS: {{ .Values.spec.authSecret.allowedKeys | trim | b64enc | quote }}
{{- end }}
