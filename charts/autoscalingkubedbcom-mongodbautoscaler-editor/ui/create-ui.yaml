          - "Off"
          schema: schema/properties/spec/properties/storage/properties/configServer/properties/trigger
          type: select
        - label: Expansion Mode
          options:
          - Online
          - Offline
          schema: schema/properties/spec/properties/storage/properties/configServer/properties/expansionMode
          type: select
        - label: Usage Threshold
          schema: schema/properties/spec/properties/storage/properties/configServer/properties/usageThreshold
          type: input
        - elements:
          - label: Applies Upto
