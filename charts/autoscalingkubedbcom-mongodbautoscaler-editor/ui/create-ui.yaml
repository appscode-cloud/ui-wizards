    - label: Timeout
      options:
      - text: 5 minutes
        value: 5m
      - text: 10 minutes
        value: 10m
      - text: 30 minutes
        value: 30m
      - text: 1 hour
        value: 1h
      - text: 2 hours
        value: 2h
      - text: 5 hours
        value: 5h
      - text: 10 hours
        value: 10h
      schema: schema/properties/spec/properties/opsRequestOptions/properties/timeout
      type: select
    - init:
        type: func
        value: setApplyToIfReady
      label: Apply
      options:
      - text: IfReady (OpsRequest will be applied if database is ready)
        value: IfReady
      - text: Always (OpsRequest will always be applied)
        value: Always
      schema: schema/properties/spec/properties/opsRequestOptions/properties/apply
      type: radio
    if:
      name: showOpsRequestOptions
