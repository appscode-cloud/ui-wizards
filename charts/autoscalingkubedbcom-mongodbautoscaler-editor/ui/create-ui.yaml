step:
- elements:
  - elements:
    - label: Name
      schema: schema/properties/metadata/properties/name
      type: input
    - label: Select Namespace
      loader: getNamespaces
      schema: schema/properties/metadata/properties/namespace
      type: select
      watcher:
        func: onNamespaceChange
        paths:
        - schema/properties/metadata/properties/namespace
    - label: Select Mongo Database
      loader:
        name: getMongoDbs
        watchPaths:
        - schema/properties/metadata/properties/namespace
      refresh: true
      schema: schema/properties/spec/properties/databaseRef/properties/name
      type: select
      validation:
        type: required
      watcher:
        func: initMetadata
        paths:
        - schema/properties/spec/properties/databaseRef/properties/name
    if:
      name: isConsole
      type: function
    showLabels: false
    type: block-layout
  - if:
      name: isConsole
      type: function
    label: Select Autoscale Type
    options:
    - description: Scale your CPU Memory based on resource usage
      text: Compute
      value: compute
    - description: Expand your database size based on volume usage
      text: Storage
      value: storage
    schema: temp/properties/autoscalingType
    type: radio
    validation:
      type: required
    watcher:
      func: initMetadata
      paths:
      - temp/properties/autoscalingType
  - elements:
    - elements:
      - elements:
        - init:
            type: func
            value: setTrigger
          label: Trigger
          options:
          - "On"
          - "Off"
          schema: schema/properties/spec/properties/compute/properties/standalone/properties/trigger
          type: select
        - label: Pod Life Time Threshold
          schema: schema/properties/spec/properties/compute/properties/standalone/properties/podLifeTimeThreshold
          type: input
        - label: Resource Difference Percentage
          schema: schema/properties/spec/properties/compute/properties/standalone/properties/resourceDiffPercentage
          type: input
        - elements:
          - label: CPU
            schema: schema/properties/spec/properties/compute/properties/standalone/properties/minAllowed/properties/cpu
            type: input
          - label: Memory
            schema: schema/properties/spec/properties/compute/properties/standalone/properties/minAllowed/properties/memory
            type: input
          label: Min Allowed
          showLabels: true
          type: block-layout
        - elements:
          - label: CPU
            schema: schema/properties/spec/properties/compute/properties/standalone/properties/maxAllowed/properties/cpu
            type: input
          - label: Memory
            schema: schema/properties/spec/properties/compute/properties/standalone/properties/maxAllowed/properties/memory
            type: input
          label: Max Allowed
          showLabels: true
          type: block-layout
        - label: Controlled Resources
          loader: setControlledResources|standalone
          multiple: true
          schema: schema/properties/spec/properties/compute/properties/standalone/properties/controlledResources
          type: select
        showLabels: false
        type: block-layout
      if:
        name: mongoTypeEqualsTo|standalone
        type: function
      label: Standalone
      showLabels: true
      type: block-layout
    - elements:
      - elements:
        - init:
            type: func
            value: setTrigger
          label: Trigger
          options:
          - "On"
          - "Off"
          schema: schema/properties/spec/properties/compute/properties/replicaSet/properties/trigger
          type: select
        - label: Pod Life Time Threshold
          schema: schema/properties/spec/properties/compute/properties/replicaSet/properties/podLifeTimeThreshold
          type: input
        - label: Resource Difference Percentage
          schema: schema/properties/spec/properties/compute/properties/replicaSet/properties/resourceDiffPercentage
          type: input
        - elements:
          - label: CPU
            schema: schema/properties/spec/properties/compute/properties/replicaSet/properties/minAllowed/properties/cpu
            type: input
          - label: Memory
            schema: schema/properties/spec/properties/compute/properties/replicaSet/properties/minAllowed/properties/memory
            type: input
          label: Min Allowed
          showLabels: true
          type: block-layout
        - elements:
          - label: CPU
            schema: schema/properties/spec/properties/compute/properties/replicaSet/properties/maxAllowed/properties/cpu
            type: input
          - label: Memory
            schema: schema/properties/spec/properties/compute/properties/replicaSet/properties/maxAllowed/properties/memory
            type: input
          label: Max Allowed
          showLabels: true
          type: block-layout
        - label: Controlled Resources
          loader: setControlledResources|replicaSet
          multiple: true
          schema: schema/properties/spec/properties/compute/properties/replicaSet/properties/controlledResources
          type: select
        showLabels: false
        type: block-layout
      if:
        name: mongoTypeEqualsTo|replicaSet
        type: function
      label: ReplicaSet
      showLabels: true
      type: block-layout
    - elements:
      - elements:
        - init:
            type: func
            value: setTrigger
          label: Trigger
          options:
          - "On"
          - "Off"
          schema: schema/properties/spec/properties/compute/properties/shard/properties/trigger
          type: select
        - label: Pod Life Time Threshold
          schema: schema/properties/spec/properties/compute/properties/shard/properties/podLifeTimeThreshold
          type: input
        - label: Resource Difference Percentage
          schema: schema/properties/spec/properties/compute/properties/shard/properties/resourceDiffPercentage
          type: input
        - elements:
          - label: CPU
            schema: schema/properties/spec/properties/compute/properties/shard/properties/minAllowed/properties/cpu
            type: input
          - label: Memory
            schema: schema/properties/spec/properties/compute/properties/shard/properties/minAllowed/properties/memory
            type: input
          label: Min Allowed
          showLabels: true
          type: block-layout
        - elements:
          - label: CPU
            schema: schema/properties/spec/properties/compute/properties/shard/properties/maxAllowed/properties/cpu
            type: input
          - label: Memory
            schema: schema/properties/spec/properties/compute/properties/shard/properties/maxAllowed/properties/memory
            type: input
          label: Max Allowed
          showLabels: true
          type: block-layout
        - label: Controlled Resources
          loader: setControlledResources|shard
          multiple: true
          schema: schema/properties/spec/properties/compute/properties/shard/properties/controlledResources
          type: select
        label: Shard
        showLabels: true
        type: block-layout
      - elements:
        - init:
            type: func
            value: setTrigger
          label: Trigger
          options:
          - "On"
          - "Off"
          schema: schema/properties/spec/properties/compute/properties/configServer/properties/trigger
          type: select
        - label: Pod Life Time Threshold
          schema: schema/properties/spec/properties/compute/properties/configServer/properties/podLifeTimeThreshold
          type: input
        - label: Resource Difference Percentage
          schema: schema/properties/spec/properties/compute/properties/configServer/properties/resourceDiffPercentage
          type: input
        - elements:
          - label: CPU
            schema: schema/properties/spec/properties/compute/properties/configServer/properties/minAllowed/properties/cpu
            type: input
          - label: Memory
            schema: schema/properties/spec/properties/compute/properties/configServer/properties/minAllowed/properties/memory
            type: input
          label: Min Allowed
          showLabels: true
          type: block-layout
        - elements:
          - label: CPU
            schema: schema/properties/spec/properties/compute/properties/configServer/properties/maxAllowed/properties/cpu
            type: input
          - label: Memory
            schema: schema/properties/spec/properties/compute/properties/configServer/properties/maxAllowed/properties/memory
            type: input
          label: Max Allowed
          showLabels: true
          type: block-layout
        - label: Controlled Resources
          loader: setControlledResources|configServer
          multiple: true
          schema: schema/properties/spec/properties/compute/properties/configServer/properties/controlledResources
          type: select
        label: Config Server
        showLabels: true
        type: block-layout
      - elements:
        - init:
            type: func
            value: setTrigger
          label: Trigger
          options:
          - "On"
          - "Off"
          schema: schema/properties/spec/properties/compute/properties/mongos/properties/trigger
          type: select
        - label: Pod Life Time Threshold
          schema: schema/properties/spec/properties/compute/properties/mongos/properties/podLifeTimeThreshold
          type: input
        - label: Resource Difference Percentage
          schema: schema/properties/spec/properties/compute/properties/mongos/properties/resourceDiffPercentage
          type: input
        - elements:
          - label: CPU
            schema: schema/properties/spec/properties/compute/properties/mongos/properties/minAllowed/properties/cpu
            type: input
          - label: Memory
            schema: schema/properties/spec/properties/compute/properties/mongos/properties/minAllowed/properties/memory
            type: input
          label: Min Allowed
          showLabels: true
          type: block-layout
        - elements:
          - label: CPU
            schema: schema/properties/spec/properties/compute/properties/mongos/properties/maxAllowed/properties/cpu
            type: input
          - label: Memory
            schema: schema/properties/spec/properties/compute/properties/mongos/properties/maxAllowed/properties/memory
            type: input
          label: Max Allowed
          showLabels: true
          type: block-layout
        - label: Controlled Resources
          loader: setControlledResources|mongos
          multiple: true
          schema: schema/properties/spec/properties/compute/properties/mongos/properties/controlledResources
          type: select
        label: Mongos
        showLabels: true
        type: block-layout
      if:
        name: mongoTypeEqualsTo|sharded
        type: function
      showLabels: false
      type: block-layout
    - elements:
      - label: Select Node Topology
        loader: fetchNodeTopology
        schema: schema/properties/spec/properties/compute/properties/nodeTopology/properties/name
        type: select
      - if:
          name: isNodeTopologySelected
          type: function
        label: Scale-up Difference Percentage
        schema: schema/properties/spec/properties/compute/properties/nodeTopology/properties/scaleUpDiffPercentage
        type: input
      - if:
          name: isNodeTopologySelected
          type: function
        label: Scale-down Difference Percentage
        schema: schema/properties/spec/properties/compute/properties/nodeTopology/properties/scaleDownDiffPercentage
        type: input
      label: Node Topology
      showLabels: true
      type: block-layout
    if:
      name: ifScalingTypeEqualsTo|compute
      type: function
    loader:
      name: getDbDetails
      watchPaths:
      - schema/properties/spec/properties/databaseRef/properties/name
    showLabels: false
    type: block-layout
  - elements:
    - elements:
      - init:
          type: func
          value: setTrigger
        label: Trigger
        options:
        - "On"
        - "Off"
        schema: schema/properties/spec/properties/storage/properties/standalone/properties/trigger
        type: select
      - label: Expansion Mode
        options:
        - Online
        - Offline
        schema: schema/properties/spec/properties/storage/properties/standalone/properties/expansionMode
        type: select
      - label: Usage Threshold
        schema: schema/properties/spec/properties/storage/properties/standalone/properties/usageThreshold
        type: input
      - elements:
        - label: Applies Upto
          schema: appliesUpto
          type: input
        - label: Threshold
          schema: threshold
          type: input
        label: Scaling Rules
        schema: schema/properties/spec/properties/storage/properties/standalone/properties/scalingRules
        type: array-object-form
      - label: Upper Bound
        schema: schema/properties/spec/properties/storage/properties/standalone/properties/upperBound
        type: input
      if:
        name: mongoTypeEqualsTo|standalone
        type: function
      label: Standalone
      showLabels: true
      type: block-layout
    - elements:
      - init:
          type: func
          value: setTrigger
        label: Trigger
        options:
        - "On"
        - "Off"
        schema: schema/properties/spec/properties/storage/properties/replicaSet/properties/trigger
        type: select
      - label: Expansion Mode
        options:
        - Online
        - Offline
        schema: schema/properties/spec/properties/storage/properties/replicaSet/properties/expansionMode
        type: select
      - label: Usage Threshold
        schema: schema/properties/spec/properties/storage/properties/replicaSet/properties/usageThreshold
        type: input
      - elements:
        - label: Applies Upto
          schema: appliesUpto
          type: input
        - label: Threshold
          schema: threshold
          type: input
        label: Scaling Rules
        schema: schema/properties/spec/properties/storage/properties/replicaSet/properties/scalingRules
        type: array-object-form
      - label: Upper Bound
        schema: schema/properties/spec/properties/storage/properties/replicaSet/properties/upperBound
        type: input
      if:
        name: mongoTypeEqualsTo|replicaSet
        type: function
      label: ReplicaSet
      showLabels: true
      type: block-layout
    - elements:
      - elements:
        - init:
            type: func
            value: setTrigger
          label: Trigger
          options:
          - "On"
          - "Off"
          schema: schema/properties/spec/properties/storage/properties/shard/properties/trigger
          type: select
        - label: Expansion Mode
          options:
          - Online
          - Offline
          schema: schema/properties/spec/properties/storage/properties/shard/properties/expansionMode
          type: select
        - label: Usage Threshold
          schema: schema/properties/spec/properties/storage/properties/shard/properties/usageThreshold
          type: input
        - elements:
          - label: Applies Upto
            schema: appliesUpto
            type: input
          - label: Threshold
            schema: threshold
            type: input
          label: Scaling Rules
          schema: schema/properties/spec/properties/storage/properties/shard/properties/scalingRules
