form:
  alert:
    additionalRuleLabels: {}
    annotations: {}
    enabled: warning
    groups:
      database:
        enabled: warning
        rules:
          diskAlmostFull:
            duration: 1m
            enabled: true
            severity: critical
            val: 95
          diskUsageHigh:
            duration: 1m
            enabled: true
            severity: warning
            val: 80
          milvusGoroutinesExplosion:
            duration: 1m
            enabled: true
            severity: warning
            val: 1000
          milvusHighCPUUsage:
            duration: 1m
            enabled: true
            severity: warning
            val: 80
          milvusHighFDsUsage:
            duration: 1m
            enabled: true
            severity: warning
            val: 110
          milvusHighMemoryUsage:
            duration: 1m
            enabled: true
            severity: warning
            val: 80
          milvusHighProcessMemoryUsage:
            duration: 1m
            enabled: true
            severity: warning
            val: 800000000
          milvusHighThreadPressure:
            duration: 1m
            enabled: true
            severity: warning
            val: 60
          milvusInstanceDown:
            duration: 30s
            enabled: true
            severity: critical
          milvusRestarted:
            duration: 1m
            enabled: true
            severity: warning
            val: 180
      kubeStash:
        enabled: warning
        rules:
          backupSessionFailed:
            duration: 0m
            enabled: true
            severity: critical
          backupSessionPeriodTooLong:
            duration: 0m
            enabled: true
            severity: warning
            val: 1800
          noBackupSessionForTooLong:
            duration: 0m
            enabled: true
            severity: warning
            val: 18000
          repositoryCorrupted:
            duration: 5m
            enabled: true
            severity: critical
          repositoryStorageRunningLow:
            duration: 5m
            enabled: true
            severity: warning
            val: 1.073741824e+10
          restoreSessionFailed:
            duration: 0m
            enabled: true
            severity: critical
          restoreSessionPeriodTooLong:
            duration: 0m
            enabled: true
            severity: warning
            val: 1800
      provisioner:
        enabled: warning
        rules:
          appPhaseCritical:
            duration: 15m
            enabled: true
            severity: warning
          appPhaseNotReady:
            duration: 1m
            enabled: true
            severity: critical
    labels:
      release: prometheus
metadata:
