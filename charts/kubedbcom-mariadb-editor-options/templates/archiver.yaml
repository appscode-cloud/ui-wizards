{{- if include "kubedbcom-mariadb-editor-options.customArchiver" . }}
{{- $spec := deepCopy .Values.spec.archiver.spec }}
{{- $backupStorage := deepCopy (dig "backupStorage" dict $spec) }}
{{- $_ := set $backupStorage "ref" .Values.spec.archiver.backupStorage }}
{{- $_ := set $spec "backupStorage" $backupStorage }}
{{- $_ := set $spec "databases" (dict "namespaces" (dict "from" "Same")) }}
apiVersion: archiver.kubedb.com/v1alpha1
kind: MariaDBArchiver
metadata:
  name: {{ include "kubedbcom-mariadb-editor-options.fullname" . }}-archiver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubedbcom-mariadb-editor-options.labels" . | nindent 4 }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}
