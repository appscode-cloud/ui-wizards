{{- if .Values.spec.configuration }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubedbcom-neo4j-editor-options.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubedbcom-neo4j-editor-options.labels" . | nindent 4 }}
stringData:
{{- range $key, $val := (.Values.spec.configuration | fromYaml) }}
  {{ $key | quote }}: {{ $val | toString | quote }}
{{- end }}
{{- end }}
