{{- if .Values.spec.authSecret.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubedbcom-mssqlserver-editor-options.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubedbcom-mssqlserver-editor-options.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
data:
  username: {{ "sa" | b64enc | quote }}
  password: {{ .Values.spec.authSecret.password | trim | b64enc | quote }}
{{- end }}
{{- if eq (include "kubedbcom-mssqlserver-editor-options.customPid" .) "true" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubedbcom-mssqlserver-editor-options.fullname" . }}-product-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubedbcom-mssqlserver-editor-options.labels" . | nindent 4 }}
type: Opaque
data:
  product-key: {{ .Values.spec.pid | trim | b64enc | quote }}
{{- end }}
