step:
- elements:
  - elements:
    - elements:
      - elements:
        - label: Name
          schema: schema/properties/metadata/properties/release/properties/name
          type: input
          validation:
            type: required
        - label: Namespace
          schema: schema/properties/metadata/properties/release/properties/namespace
          type: input
          validation:
            type: required
        type: horizontal-layout
      if:
        name: isActivePage|basic-info
        type: function
      label: Basic Info
      showLabels: true
      type: block-layout
    - elements:
      - elements:
        - label: Storage Size
          schema: schema/properties/spec/properties/metrics/properties/thanos/properties/compact/properties/storageSize
          type: input
          validation:
            name: validateStorageSize
            type: custom
        type: horizontal-layout
      - elements:
        - label: Raw Retention
          schema: raw
          type: input
          validation:
            name: validateRawRetention
            type: custom
        - label: 5m Retention
          schema: fiveMinutes
          type: input
          validation:
            name: validateFiveMinutesRetention
            type: custom
        - label: 1h Retention
          schema: oneHour
          type: input
          validation:
            name: validateRetention
            type: custom
        label: Retention Config
        schema: schema/properties/spec/properties/metrics/properties/thanos/properties/compact/properties/retentionConfig
        type: array-object-form
        validation:
          name: validateRetentionConfig
          type: custom
      if:
        name: isActivePage|metrics-thanos-compact
        type: function
      label: Compact
      showLabels: true
      type: block-layout
    - elements:
      - elements:
        - label: Storage Size
          schema: schema/properties/spec/properties/metrics/properties/thanos/properties/store/properties/storageSize
          type: input
          validation:
            name: validateStorageSize
            type: custom
        - label: Ignore Deletion Marks Delay
          schema: schema/properties/spec/properties/metrics/properties/thanos/properties/store/properties/ignoreDeletionMarksDelay
          type: input
          validation:
            name: validateRetention
            type: custom
        type: horizontal-layout
      - elements:
        - elements:
          - label: Type
            schema: schema/properties/spec/properties/metrics/properties/thanos/properties/store/properties/shardingStrategy/properties/type
            type: input
          - label: Shards
            schema: schema/properties/spec/properties/metrics/properties/thanos/properties/store/properties/shardingStrategy/properties/shards
            type: input
          type: horizontal-layout
        label: Sharding Strategy
        showLabels: true
        type: block-layout
      if:
        name: isActivePage|metrics-thanos-store
        type: function
      label: Store
      showLabels: true
      type: block-layout
    - elements:
      - elements:
        - label: Replicas
          schema: schema/properties/spec/properties/metrics/properties/thanos/properties/query/properties/replicas
          type: input
        - label: Frontend Replicas
          schema: schema/properties/spec/properties/metrics/properties/thanos/properties/query/properties/queryFrontend/properties/replicas
          type: input
        type: horizontal-layout
      if:
        name: isActivePage|metrics-thanos-query
        type: function
      label: Query
      showLabels: true
      type: block-layout
    - elements:
      - elements:
        - elements:
          - label: Hashring Name
            schema: schema/properties/spec/properties/metrics/properties/thanos/properties/receive/properties/ingesterSpec/properties/name
            type: input
          - label: Replicas
            schema: schema/properties/spec/properties/metrics/properties/thanos/properties/receive/properties/ingesterSpec/properties/replicas
            type: input
          type: horizontal-layout
        - elements:
          - label: Storage Size
            schema: schema/properties/spec/properties/metrics/properties/thanos/properties/receive/properties/ingesterSpec/properties/storageSize
            type: input
            validation:
              name: validateStorageSize
              type: custom
          - label: TSDB Retention
            schema: schema/properties/spec/properties/metrics/properties/thanos/properties/receive/properties/ingesterSpec/properties/tsdbRetention
            type: input
            validation:
              name: validateRetention
              type: custom
          type: horizontal-layout
        - elements:
          - elements:
            - label: Matcher Type
              schema: schema/properties/spec/properties/metrics/properties/thanos/properties/receive/properties/ingesterSpec/properties/tenancyConfig/properties/tenantMatcherType
              type: select
            - label: Tenant Header
              schema: schema/properties/spec/properties/metrics/properties/thanos/properties/receive/properties/ingesterSpec/properties/tenancyConfig/properties/tenantHeader
              type: input
            type: horizontal-layout
          - elements:
            - label: Default Tenant ID
              schema: schema/properties/spec/properties/metrics/properties/thanos/properties/receive/properties/ingesterSpec/properties/tenancyConfig/properties/defaultTenantID
              type: input
            - label: Tenant Label Name
              schema: schema/properties/spec/properties/metrics/properties/thanos/properties/receive/properties/ingesterSpec/properties/tenancyConfig/properties/tenantLabelName
              type: input
            type: horizontal-layout
          label: Tenancy Config
          showLabels: true
          type: block-layout
        label: Ingester
        showLabels: true
        type: block-layout
      - elements:
        - elements:
          - label: Replicas
            schema: schema/properties/spec/properties/metrics/properties/thanos/properties/receive/properties/routerSpec/properties/replicas
            type: input
          - label: Replication Factor
            schema: schema/properties/spec/properties/metrics/properties/thanos/properties/receive/properties/routerSpec/properties/replicationFactor
            type: input
            validation:
              name: validateReplicationFactor
              type: custom
          type: horizontal-layout
        - buttonClass: is-light is-outlined
          label: External Labels
          schema: schema/properties/spec/properties/metrics/properties/thanos/properties/receive/properties/routerSpec/properties/externalLabels
          type: object-item
        label: Router
        showLabels: true
        type: block-layout
      if:
        name: isActivePage|metrics-thanos-receive
        type: function
      label: Receive
      showLabels: true
      type: block-layout
    - elements:
      - elements:
        - label: Replicas
          schema: schema/properties/spec/properties/metrics/properties/thanos/properties/ruler/properties/replicas
          type: input
        - label: Storage Size
          schema: schema/properties/spec/properties/metrics/properties/thanos/properties/ruler/properties/storageSize
          type: input
          validation:
            name: validateStorageSize
            type: custom
        type: horizontal-layout
      - label: Alertmanager URL
        schema: schema/properties/spec/properties/metrics/properties/thanos/properties/ruler/properties/alertmanagerURL
        type: input
      if:
        name: isActivePage|metrics-thanos-ruler
        type: function
      label: Ruler
      showLabels: true
      type: block-layout
    - elements:
      - element:
          label: Argument
          type: input
        label: Additional Args
        schema: schema/properties/spec/properties/metrics/properties/thanos/properties/ruler/properties/additionalConfig/properties/additionalArgs
        type: array-item-form
      - elements:
        - customClass: mb-16
          elements:
          - label: Volume Type
            options:
            - text: Secret
              value: Secret
            - text: ConfigMap
              value: ConfigMap
            schema: schema/properties/spec/properties/metrics/properties/thanos/properties/ruler/properties/additionalConfig/properties/additionalVolumes/properties/0/properties/volumeType
            type: select
          type: horizontal-layout
        - customClass: mb-16
          elements:
          - label: Name
            schema: schema/properties/spec/properties/metrics/properties/thanos/properties/ruler/properties/additionalConfig/properties/additionalVolumes/properties/0/properties/name
            type: input
            validation:
              type: required
          - if:
              name: isVolumeType|ConfigMap
              type: function
            label: ConfigMap Name
            schema: schema/properties/spec/properties/metrics/properties/thanos/properties/ruler/properties/additionalConfig/properties/additionalVolumes/properties/0/properties/secretName
            type: input
            validation:
              type: required
          - if:
              name: isVolumeType|Secret
              type: function
            label: Secret Name
            schema: schema/properties/spec/properties/metrics/properties/thanos/properties/ruler/properties/additionalConfig/properties/additionalVolumes/properties/0/properties/secretName
            type: input
            validation:
              type: required
          type: horizontal-layout
        - customClass: mb-16
          elements:
          - label: Key
            schema: schema/properties/spec/properties/metrics/properties/thanos/properties/ruler/properties/additionalConfig/properties/additionalVolumes/properties/0/properties/key
            type: input
            validation:
              type: required
          - label: Path
            schema: schema/properties/spec/properties/metrics/properties/thanos/properties/ruler/properties/additionalConfig/properties/additionalVolumes/properties/0/properties/path
            type: input
            validation:
              type: required
          - disable: true
            label: Mode
            schema: schema/properties/spec/properties/metrics/properties/thanos/properties/ruler/properties/additionalConfig/properties/additionalVolumes/properties/0/properties/mode
            type: input
            watcher:
              func: volumeMode
              paths:
              - schema/properties/spec/properties/metrics/properties/thanos/properties/ruler/properties/additionalConfig/properties/additionalVolumes/properties/0/properties/volumeType
          type: horizontal-layout
        label: Additional Volumes
        showLabels: true
        type: block-layout
      - elements:
        - customClass: mb-16
          elements:
          - disable: true
            label: Name
            schema: temp/properties/additionalVolumeMount/properties/name
            type: input
            watcher:
              func: volumeName
              paths:
              - schema/properties/spec/properties/metrics/properties/thanos/properties/ruler/properties/additionalConfig/properties/additionalVolumes/properties/0/properties/name
          - disable: true
            label: Mount Path
            schema: temp/properties/additionalVolumeMount/properties/mountPath
            type: input
            watcher:
              func: volumeMountPath
              paths:
              - schema/properties/spec/properties/metrics/properties/thanos/properties/ruler/properties/additionalConfig/properties/additionalVolumes/properties/0/properties/path
          type: horizontal-layout
        - label: Read Only
          schema: temp/properties/additionalVolumeMount/properties/readOnly
          type: switch
        label: Additional Volume Mounts
        showLabels: true
        type: block-layout
      if:
        name: isActivePage|metrics-thanos-additional-config
        type: function
      label: Additional Config
      showLabels: true
      type: block-layout
    - elements:
      - hasIcon: true
        isClickable: true
        label: ClickHouse for Logs
        loader: pillarStatus|logs
        switchInfo:
          schema: schema/properties/spec/properties/logs/properties/enabled
          type: switch
        type: neutral
        watcher:
          func: pillarStatus|logs
          paths:
          - schema/properties/spec/properties/logs/properties/enabled
      - elements:
        - isHorizontal: true
          label: Deployment Mode
          options:
          - description: Single node ClickHouse without high availability
            text: Standalone
            value: Standalone
          - description: ClickHouse Topology cluster for high performance and high availability.
            text: Cluster Topology
            value: ClusterTopology
          schema: schema/properties/spec/properties/logs/properties/deploymentMode
          type: radio
        - elements:
          - label: Version
            schema: schema/properties/spec/properties/logs/properties/version
            type: input
          - label: Deletion Policy
            schema: schema/properties/spec/properties/logs/properties/deletionPolicy
            type: select
          type: horizontal-layout
        if:
          name: isPillarEnabled|logs
          type: function
        label: General
        showLabels: true
        type: block-layout
      - elements:
        - elements:
          - label: Storage Class
            loader: getStorageClasses
            schema: schema/properties/spec/properties/logs/properties/storage/properties/storageClassName
            type: select
          - label: Storage Size
            schema: schema/properties/spec/properties/logs/properties/storage/properties/size
            type: input
            validation:
              name: validateStorageSize
              type: custom
          type: horizontal-layout
        if:
          name: isPillarEnabled|logs
          type: function
        label: Persistent Storage
        showLabels: true
        type: block-layout
      - elements:
        - elements:
          - label: Bucket
            schema: schema/properties/spec/properties/logs/properties/s3/properties/bucket
            type: input
            watcher:
              func: s3Field|bucket
              paths:
              - schema/properties/spec/properties/logs/properties/s3/properties/bucket
          - label: Region
            schema: schema/properties/spec/properties/logs/properties/s3/properties/region
            type: input
            watcher:
              func: s3Field|region
              paths:
              - schema/properties/spec/properties/logs/properties/s3/properties/region
          type: horizontal-layout
        - elements:
          - label: Endpoint
            schema: schema/properties/spec/properties/logs/properties/s3/properties/endpoint
            type: input
            watcher:
              func: s3Field|endpoint
              paths:
              - schema/properties/spec/properties/logs/properties/s3/properties/endpoint
          - label: Access Key
            schema: schema/properties/spec/properties/logs/properties/s3/properties/accessKey
            type: input
            watcher:
              func: s3Field|accessKey
              paths:
              - schema/properties/spec/properties/logs/properties/s3/properties/accessKey
          type: horizontal-layout
        - elements:
          - isSecret: true
            label: Secret Key
            schema: schema/properties/spec/properties/logs/properties/s3/properties/secretKey
            type: input
            watcher:
              func: s3Field|secretKey
              paths:
              - schema/properties/spec/properties/logs/properties/s3/properties/secretKey
          type: horizontal-layout
        if:
          name: isPillarEnabled|logs
          type: function
        label: S3 Storage
        showLabels: true
        type: block-layout
      - elements:
        - elements:
          - elements:
            - label: Name
              schema: schema/properties/spec/properties/logs/properties/clusterTopology/properties/cluster/properties/name
              type: input
            - label: Replicas
              schema: schema/properties/spec/properties/logs/properties/clusterTopology/properties/cluster/properties/replicas
              type: input
              validation:
                name: validateReplicationFactor
                type: custom
            type: horizontal-layout
          - elements:
            - label: Shards
              schema: schema/properties/spec/properties/logs/properties/clusterTopology/properties/cluster/properties/shards
              type: input
            - label: Storage Class
              loader: getStorageClasses
              schema: schema/properties/spec/properties/logs/properties/clusterTopology/properties/cluster/properties/persistence/properties/storageClassName
              type: select
            - label: Storage Size
              schema: schema/properties/spec/properties/logs/properties/clusterTopology/properties/cluster/properties/persistence/properties/size
              type: input
              validation:
                name: validateStorageSize
                type: custom
            type: horizontal-layout
          label: Cluster
          showLabels: true
          type: block-layout
        - elements:
          - label: Externally Managed
            schema: schema/properties/spec/properties/logs/properties/clusterTopology/properties/clickHouseKeeper/properties/externallyManaged
            type: switch
          - elements:
            - label: Replicas
              schema: schema/properties/spec/properties/logs/properties/clusterTopology/properties/clickHouseKeeper/properties/replicas
              type: input
              validation:
                name: validateReplicationFactor
                type: custom
            - label: Storage Class
              loader: getStorageClasses
              schema: schema/properties/spec/properties/logs/properties/clusterTopology/properties/clickHouseKeeper/properties/persistence/properties/storageClassName
              type: select
            - label: Storage Size
              schema: schema/properties/spec/properties/logs/properties/clusterTopology/properties/clickHouseKeeper/properties/persistence/properties/size
              type: input
              validation:
                name: validateStorageSize
                type: custom
            type: horizontal-layout
          label: ClickHouse Keeper
          showLabels: true
          type: block-layout
        if:
          name: isClusterTopology|logs
          type: function
        label: Cluster Topology
        showLabels: true
        type: block-layout
      - elements:
        - elements:
          - label: Secret Name
            schema: name
            type: input
          - label: Key
            schema: key
            type: input
          label: Certificates
          schema: schema/properties/spec/properties/logs/properties/clientCaCertificates
          type: array-object-form
          validation:
            name: validateClientCaCertificates
            type: custom
        hideBlock: true
        if:
          name: isPillarEnabled|logs
          type: function
        label: Client CA Certificates
        showLabels: true
        type: block-layout
      if:
        name: isActivePage|logs-clickhouse
        type: function
      type: block-layout
    - elements:
      - elements:
        - label: Bucket
          schema: schema/properties/spec/properties/logs/properties/s3/properties/bucket
          type: input
          watcher:
            func: s3Field|bucket
            paths:
            - schema/properties/spec/properties/logs/properties/s3/properties/bucket
        - label: Region
          schema: schema/properties/spec/properties/logs/properties/s3/properties/region
          type: input
          watcher:
            func: s3Field|region
            paths:
            - schema/properties/spec/properties/logs/properties/s3/properties/region
        type: horizontal-layout
      - elements:
        - label: Endpoint
          schema: schema/properties/spec/properties/logs/properties/s3/properties/endpoint
          type: input
          watcher:
            func: s3Field|endpoint
            paths:
            - schema/properties/spec/properties/logs/properties/s3/properties/endpoint
        - label: Access Key
          schema: schema/properties/spec/properties/logs/properties/s3/properties/accessKey
          type: input
          watcher:
            func: s3Field|accessKey
            paths:
            - schema/properties/spec/properties/logs/properties/s3/properties/accessKey
        type: horizontal-layout
      - elements:
        - isSecret: true
          label: Secret Key
          schema: schema/properties/spec/properties/logs/properties/s3/properties/secretKey
          type: input
          watcher:
            func: s3Field|secretKey
            paths:
            - schema/properties/spec/properties/logs/properties/s3/properties/secretKey
        type: horizontal-layout
      if:
        name: isActivePage|s3
        type: function
      label: S3 Object Storage
      showLabels: true
      type: block-layout
    label: Telemetry Stack
    options:
    - icon: computer-settings
      text: Basic Info
      value: basic-info
    - options:
      - icon: circle
        options:
        - icon: cloud
          text: S3 Storage
          value: s3
        - icon: arrow-shrink-02
          text: Compact
          value: metrics-thanos-compact
        - icon: cube
          text: Store
          value: metrics-thanos-store
        - icon: search-01
          text: Query
          value: metrics-thanos-query
        - icon: download-04
          text: Receive
          value: metrics-thanos-receive
        - icon: ruler
          text: Ruler
          value: metrics-thanos-ruler
        - icon: sliders-horizontal
          text: Additional Config
          value: metrics-thanos-additional-config
        tag: Recommended
        text: Thanos
      text: Metrics
    - options:
      - activeIcon: radio-button
        checkIcon: success
        checkIf:
          name: isPillarEnabled|logs
          type: function
        icon: circle
        tag: Recommended
        text: ClickHouse
        value: logs-clickhouse
      text: Logs
    schema: temp/properties/telemetryPage
    subtitle: Configuration
    type: sidebar-layout
    watcher:
      func: syncS3
      paths:
      - schema/properties/spec/properties/logs/properties/s3
      - schema/properties/spec/properties/metrics/properties/thanos/properties/ruler/properties/additionalConfig/properties/additionalVolumeMounts
      - temp/properties/additionalVolumeMount
  id: options
  type: single-step-form
type: multi-step-form
