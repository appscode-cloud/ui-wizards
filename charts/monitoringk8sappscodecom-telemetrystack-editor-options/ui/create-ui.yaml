          - label: Storage Size
            schema: schema/properties/spec/properties/logs/properties/storage/properties/size
            type: input
          type: horizontal-layout
        if:
          name: isPillarEnabled|logs
          type: function
        label: Persistent Storage
        showLabels: true
        type: block-layout
      - elements:
