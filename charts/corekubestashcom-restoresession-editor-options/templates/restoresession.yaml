apiVersion: core.kubestash.com/v1alpha1
kind: RestoreSession
metadata:
  name: {{ include "corekubestashcom-restoresession-editor-options.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "corekubestashcom-restoresession-editor-options.labels" . | nindent 4 }}
  {{- if .Values.spec.annotations }}
  annotations:
    {{- include "corekubestashcom-restoresession-editor-options.annotations" . | nindent 4 }}
  {{- end }}
spec:
  dataSource:
    repository: {{ .Values.spec.dataSource.repository.name }}
    namespace: {{ .Values.spec.dataSource.repository.namespace }}
    snapshot: {{ .Values.spec.dataSource.snapshot }}
    encryptionSecret:
      {{- toYaml .Values.spec.dataSource.encryptionSecret | nindent 6 }}
  target:
    {{- toYaml .Values.spec.target | nindent 4 }}
  addon:
    name: {{ .Values.spec.addon.name }}
    tasks:
    {{- range .Values.spec.addon.tasks }}
      - name: {{ .name }}
        {{- if .params }}
        params: {{ .params }}
        {{- end }}
    {{- end }}
    {{- $runAsUser := include "corekubestashcom-restoresession-editor-options.runAsUser" . }}
    {{- if $runAsUser }}
    jobTemplate:
      spec:
        {{- if eq .Values.spec.target.kind "Neo4j" }}
        volumes:
          - name: data
            persistentVolumeClaim:
              claimName: data-{{ .Values.spec.target.name }}-0
        volumeMounts:
          - mountPath: /data
            name: data
            subPath: data
        {{- end }}
        nodeSelector:
          kubernetes.io/os: linux
        securityContext:
          runAsUser: {{ $runAsUser }}
          runAsGroup: 0
          {{- if eq .Values.spec.target.kind "Neo4j" }}
          fsGroup: {{ $runAsUser }}
          {{- end }}
    containerRuntimeSettings:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsGroup: 0
        runAsNonRoot: true
        runAsUser: {{ $runAsUser }}
        seccompProfile:
          type: RuntimeDefault
    {{- end }}
