name: Release

on:
  push:
    tags:
      - "*.*"
    # git tag -fa v0.36.1 -m "v0.36.1" -m "Charts: kubedbcom-*-editor-options"
  workflow_dispatch:
    inputs:
      # single `find -name` glob, so no brace expansion; anchor on the group
      # prefix -- `*-editor` matches 824 charts, not just the db editors.
      # counts below were taken when this was written; they drift as charts land.
      #   kubedbcom-*-editor-options   30   db options only
      #   kubedbcom-*                  63   db editors + options
      #   <empty>                     886   every chart
      #   *-editor-options             39   options charts of every group
      #   kubedbcom-mongodb-*           2   one db, editor + options
      #   opskubedbcom-*               33   ops-request editors
      #   *kubestashcom-*              19   kubestash core + storage + addons
      # dry-run locally: make stage-charts CHARTS_PATTERN='<glob>'
      charts_pattern:
        description: "Chart dir glob; Use patterns like 'kubedbcom-*-editor-options' or 'kubedbcom-*' etc"
        required: false
        default: "kubedbcom-*-editor-options"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}-release
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Install Helm 3
        run: |
          pushd /usr/local/bin && sudo curl -fsSLO https://github.com/x-helm/helm/releases/latest/download/helm && sudo chmod +x helm && popd

      - name: Clone charts repository
        env:
          GITHUB_USER: 1gtm
          GITHUB_TOKEN: ${{ secrets.LGTM_GITHUB_TOKEN }}
          CHART_REPOSITORY: ${{ secrets.CHART_REPOSITORY }}
        run: |
          url="https://${GITHUB_USER}:${GITHUB_TOKEN}@${CHART_REPOSITORY}.git"
          cd $RUNNER_WORKSPACE
          git clone $url
          cd $(basename $CHART_REPOSITORY)
          git config user.name "${GITHUB_USER}"
          git config user.email "${GITHUB_USER}@appscode.com"

      - name: Package
        env:
          GITHUB_TOKEN: ${{ secrets.LGTM_GITHUB_TOKEN }}
          CHART_REPOSITORY: ${{ secrets.CHART_REPOSITORY }}
          CHARTS_PATTERN: ${{ inputs.charts_pattern }}
        run: |
          GIT_TAG=${GITHUB_REF#"refs/tags/"}
          # tag pushes carry no inputs; an annotated tag can scope itself with a
          # "Charts: <glob>" body marker, same convention as ProductLine/Release
          if [ -z "$CHARTS_PATTERN" ]; then
            CHARTS_PATTERN=$(git -C $GITHUB_WORKSPACE tag -l --format='%(body)' "$GIT_TAG" |
              sed -n 's/^Charts:[[:space:]]*//p' | tr -d '\r\t' | head -1)
          fi
          echo "publishing charts matching: ${CHARTS_PATTERN:-<all>}"
          CHARTS_DIR=charts
          if [ -n "$CHARTS_PATTERN" ]; then
            make -C $GITHUB_WORKSPACE stage-charts CHARTS_PATTERN="$CHARTS_PATTERN" STAGE_DIR=.charts-subset
            CHARTS_DIR=.charts-subset
          fi
          cd $RUNNER_WORKSPACE/$(basename $CHART_REPOSITORY)
          if [[ $GIT_TAG =~ "-alpha." ]] || [[ $GIT_TAG =~ "-beta." ]]; then
            export REPO_DIR=ui-testing
          else
            export REPO_DIR=ui
          fi
          ./hack/scripts/open-pr.sh $GITHUB_WORKSPACE $CHARTS_DIR
