name: OCI

on:
  push:
    tags:
      - "*.*"
    # git tag -fa v0.36.1 -m "v0.36.1" -m "Charts: kubedbcom-*-editor-options"
  workflow_dispatch:
    inputs:
      # single `find -name` glob, so no brace expansion; anchor on the group
      # prefix -- `*-editor` matches 824 charts, not just the db editors.
      # counts below were taken when this was written; they drift as charts land.
      #   kubedbcom-*-editor-options   30   db options only
      #   kubedbcom-*                  63   db editors + options
      #   <empty>                     886   every chart
      #   *-editor-options             39   options charts of every group
      #   kubedbcom-mongodb-*           2   one db, editor + options
      #   opskubedbcom-*               33   ops-request editors
      #   *kubestashcom-*              19   kubestash core + storage + addons
      # dry-run locally: make stage-charts CHARTS_PATTERN='<glob>'
      charts_pattern:
        description: "Chart dir glob; Use patterns like 'kubedbcom-*-editor-options' or 'kubedbcom-*' etc"
        required: false
        default: "kubedbcom-*-editor-options"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}-oci
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: 1gtm
          password: ${{ secrets.LGTM_GITHUB_TOKEN }}

      - name: Install Helm 3
        run: |
          pushd /usr/local/bin && sudo curl -fsSLO https://github.com/x-helm/helm/releases/latest/download/helm && sudo chmod +x helm && popd

      - name: Clone charts repository
        env:
          GITHUB_USER: 1gtm
          GITHUB_TOKEN: ${{ secrets.LGTM_GITHUB_TOKEN }}
          CHART_REPOSITORY: ${{ secrets.CHART_REPOSITORY }}
        run: |
          url="https://${GITHUB_USER}:${GITHUB_TOKEN}@${CHART_REPOSITORY}.git"
          cd $RUNNER_WORKSPACE
          git clone $url
          cd $(basename $CHART_REPOSITORY)
          git config user.name "${GITHUB_USER}"
          git config user.email "${GITHUB_USER}@appscode.com"

      - name: Publish OCI charts
        env:
          GITHUB_USER: 1gtm
          GITHUB_TOKEN: ${{ secrets.LGTM_GITHUB_TOKEN }}
          CHART_REPOSITORY: ${{ secrets.CHART_REPOSITORY }}
          CHARTS_PATTERN: ${{ inputs.charts_pattern }}
        run: |
          GIT_TAG=""
          case "$GITHUB_REF" in refs/tags/*) GIT_TAG=${GITHUB_REF#refs/tags/} ;; esac
          # tag pushes carry no inputs; an annotated tag can scope itself with a
          # "Charts: <glob>" body marker, same convention as ProductLine/Release
          if [ -z "$CHARTS_PATTERN" ] && [ -n "$GIT_TAG" ]; then
            # actions/checkout fetches the tag by sha, leaving refs/tags/$GIT_TAG
            # lightweight; without the real tag object %(body) yields the commit
            # message and the marker matches wrapped prose in it
            git -C $GITHUB_WORKSPACE fetch --force origin "refs/tags/$GIT_TAG:refs/tags/$GIT_TAG" || true
            if [ "$(git -C $GITHUB_WORKSPACE cat-file -t "$GIT_TAG" 2>/dev/null)" = tag ]; then
              CHARTS_PATTERN=$(git -C $GITHUB_WORKSPACE tag -l --format='%(body)' "$GIT_TAG" |
                sed -n 's/^Charts:[[:space:]]*//p' | tr -d '\r\t' | head -1)
            fi
          fi
          # a glob is one shell word; whitespace means the marker matched prose
          case "$CHARTS_PATTERN" in
            *[[:space:]]*)
              echo "::error::ignoring non-glob Charts marker: $CHARTS_PATTERN"
              exit 1
              ;;
          esac
          echo "publishing charts matching: ${CHARTS_PATTERN:-<all>}"
          CHARTS_DIR=charts
          if [ -n "$CHARTS_PATTERN" ]; then
            make -C $GITHUB_WORKSPACE stage-charts CHARTS_PATTERN="$CHARTS_PATTERN" STAGE_DIR=.charts-subset
            CHARTS_DIR=.charts-subset
          fi
          export REGISTRY_0=oci://ghcr.io/appscode-charts
          $RUNNER_WORKSPACE/$(basename $CHART_REPOSITORY)/hack/scripts/publish-oci-charts.sh $(pwd) $CHARTS_DIR
